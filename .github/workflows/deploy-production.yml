name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kibotalk-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment secrets
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          JP_STT_DASHSCOPE_API_KEY: ${{ secrets.JP_STT_DASHSCOPE_API_KEY }}
          JP_STT_DASHSCOPE_WS_URL: ${{ secrets.JP_STT_DASHSCOPE_WS_URL }}
        run: |
          for secret_name in \
            DEPLOY_SSH_KEY SERVER_HOST SERVER_USER \
            JP_STT_DASHSCOPE_API_KEY JP_STT_DASHSCOPE_WS_URL; do
            if [ -z "${!secret_name}" ]; then
              echo "::error::Missing Actions secret: ${secret_name}"
              exit 1
            fi
          done
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519_primary
          chmod 600 ~/.ssh/id_ed25519_primary
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts
      - name: Configure primary routes and providers
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          JP_STT_DASHSCOPE_API_KEY: ${{ secrets.JP_STT_DASHSCOPE_API_KEY }}
          JP_STT_DASHSCOPE_WS_URL: ${{ secrets.JP_STT_DASHSCOPE_WS_URL }}
        run: |
          case "$JP_STT_DASHSCOPE_WS_URL" in
            wss://*.ap-northeast-1.maas.aliyuncs.com/api-ws/v1/realtime) ;;
            *) echo "::error::JP_STT_DASHSCOPE_WS_URL must use the Alibaba Cloud Tokyo realtime endpoint"; exit 1 ;;
          esac
          printf '%s\n%s\n' \
            "$JP_STT_DASHSCOPE_API_KEY" \
            "$JP_STT_DASHSCOPE_WS_URL" \
            | ssh -i ~/.ssh/id_ed25519_primary "${SERVER_USER}@${SERVER_HOST}" '
                set -eu
                IFS= read -r stt_key
                IFS= read -r stt_url
                set_env() {
                  name=$1
                  value=$2
                  escaped=$(printf "%s" "$value" | sed "s/[|&]/\\\\&/g")
                  if grep -q "^${name}=" /opt/kibotalk/.env; then
                    sed -i "s|^${name}=.*|${name}=${escaped}|" /opt/kibotalk/.env
                  else
                    printf "%s=%s\n" "$name" "$value" >> /opt/kibotalk/.env
                  fi
                }
                set_env RELAY_NODES_JSON "[]"
                set_env STT_DASHSCOPE_API_KEY "$stt_key"
                set_env STT_DASHSCOPE_WS_URL "$stt_url"
                chmod 600 /opt/kibotalk/.env
              '
      - name: Validate server environments
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519_primary "${SERVER_USER}@${SERVER_HOST}" '
            set -eu
            test -s /opt/kibotalk/.env
            for name in \
              RELAY_PRIMARY_ORIGIN RELAY_NODES_JSON \
              RELAY_TOKEN_PRIVATE_KEY RELAY_TOKEN_PUBLIC_KEY RELAY_NODE_SECRET \
              STT_ACTIVE STT_DASHSCOPE_API_KEY STT_DASHSCOPE_WS_URL \
              LLM_ACTIVE; do
              grep -q "^${name}=." /opt/kibotalk/.env
            done
          '
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate release
        run: |
          pnpm typecheck
          pnpm test
      - name: Build API image
        run: |
          docker build --platform linux/amd64 --tag "kibotalk-api:${GITHUB_SHA}" .
          docker build --platform linux/amd64 --tag kibotalk-caddy:2.10 --file infra/production/Caddy.Dockerfile .
          docker build --platform linux/amd64 --tag kibotalk-postgres:17 --file infra/production/Postgres.Dockerfile .
          touch infra/production/.env
          (
            cd infra/production
            POSTGRES_PASSWORD=validation docker compose -f compose.yaml \
              config --quiet --no-env-resolution --no-path-resolution
          )
          rm infra/production/.env
          docker run --rm \
            --volume "$PWD/infra/production/Caddyfile:/etc/caddy/Caddyfile:ro" \
            kibotalk-caddy:2.10 \
            caddy validate --config /etc/caddy/Caddyfile
          docker save \
            "kibotalk-api:${GITHUB_SHA}" \
            kibotalk-caddy:2.10 \
            kibotalk-postgres:17 \
            | gzip -1 > /tmp/kibotalk-images.tar.gz
      - name: Stage on-device model mirror
        run: |
          pnpm --filter @kibotalk/desktop download-models
          tar -C apps/desktop/resources/bundle-models -czf /tmp/kibotalk-models.tar.gz .
      - name: Upload release payload
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519_primary "${SERVER_USER}@${SERVER_HOST}" "mkdir -p /opt/kibotalk/incoming"
          scp -i ~/.ssh/id_ed25519_primary /tmp/kibotalk-images.tar.gz "${SERVER_USER}@${SERVER_HOST}:/opt/kibotalk/incoming/kibotalk-images.tar.gz"
          scp -i ~/.ssh/id_ed25519_primary /tmp/kibotalk-models.tar.gz "${SERVER_USER}@${SERVER_HOST}:/opt/kibotalk/incoming/kibotalk-models.tar.gz"
          scp -i ~/.ssh/id_ed25519_primary infra/production/compose.yaml infra/production/Caddyfile "${SERVER_USER}@${SERVER_HOST}:/opt/kibotalk/"
      - name: Activate release
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          # GITHUB_SHA must expand on the runner before this script reaches the server.
          # shellcheck disable=SC2029
          ssh -i ~/.ssh/id_ed25519_primary "${SERVER_USER}@${SERVER_HOST}" "
            set -eu
            gzip -dc /opt/kibotalk/incoming/kibotalk-images.tar.gz | docker load
            rm -rf /opt/kibotalk/models.next
            mkdir -p /opt/kibotalk/models.next
            tar -xzf /opt/kibotalk/incoming/kibotalk-models.tar.gz -C /opt/kibotalk/models.next
            rm -rf /opt/kibotalk/models.previous
            if [ -d /opt/kibotalk/models ]; then
              mv /opt/kibotalk/models /opt/kibotalk/models.previous
            fi
            mv /opt/kibotalk/models.next /opt/kibotalk/models
            rm -rf /opt/kibotalk/models.previous
            cd /opt/kibotalk
            if grep -q '^KIBOTALK_API_IMAGE=' .env; then
              sed -i 's|^KIBOTALK_API_IMAGE=.*|KIBOTALK_API_IMAGE=kibotalk-api:${GITHUB_SHA}|' .env
            else
              printf '\nKIBOTALK_API_IMAGE=kibotalk-api:${GITHUB_SHA}\n' >> .env
            fi
            docker compose --env-file .env -f compose.yaml up -d --pull never
          "
      - name: Verify deployment
        run: |
          for _attempt in $(seq 1 24); do
            if curl --fail --silent --show-error https://app.kibotalk.app/health \
              && curl --fail --silent --show-error \
                https://app.kibotalk.app/models/onnx-community/wespeaker-voxceleb-resnet34-LM/config.json \
                >/dev/null \
              && curl --fail --silent --show-error --range 0-0 \
                https://app.kibotalk.app/models/onnx-community/wespeaker-voxceleb-resnet34-LM/onnx/model_quantized.onnx \
                >/dev/null \
              && curl --fail --silent --show-error https://kibotalk.app/en/ >/dev/null \
              && test "$(curl --silent --output /dev/null --write-out '%{redirect_url}' https://www.kibotalk.app/)" = "https://kibotalk.app/" \
              && curl --fail --silent --show-error https://advx.kibotalk.app/ \
                | grep --quiet '正在清理旧版网页数据'; then
              exit 0
            fi
            sleep 5
          done
          exit 1
