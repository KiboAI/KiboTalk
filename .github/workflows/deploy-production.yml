name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kibotalk-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment secrets
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          STT_IFLYTEK_APP_ID: ${{ secrets.STT_IFLYTEK_APP_ID }}
          STT_IFLYTEK_API_KEY: ${{ secrets.STT_IFLYTEK_API_KEY }}
          STT_IFLYTEK_API_SECRET: ${{ secrets.STT_IFLYTEK_API_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          for secret_name in \
            DEPLOY_SSH_KEY SERVER_HOST SERVER_USER \
            STT_IFLYTEK_APP_ID STT_IFLYTEK_API_KEY STT_IFLYTEK_API_SECRET \
            RESEND_API_KEY; do
            if [ -z "${!secret_name}" ]; then
              echo "::error::Missing Actions secret: ${secret_name}"
              exit 1
            fi
          done
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519_primary
          chmod 600 ~/.ssh/id_ed25519_primary
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts
      - name: Resolve desktop release metadata
        run: |
          echo "APP_VERSION=$(node -p "require('./apps/desktop/package.json').version")" >> "$GITHUB_ENV"
          echo "APP_PUBLISHED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Configure primary routes and providers
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          STT_IFLYTEK_APP_ID: ${{ secrets.STT_IFLYTEK_APP_ID }}
          STT_IFLYTEK_API_KEY: ${{ secrets.STT_IFLYTEK_API_KEY }}
          STT_IFLYTEK_API_SECRET: ${{ secrets.STT_IFLYTEK_API_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          APP_VERSION: ${{ env.APP_VERSION }}
          APP_PUBLISHED_AT: ${{ env.APP_PUBLISHED_AT }}
        run: |
          printf '%s\n%s\n%s\n%s\n%s\n%s\n' \
            "$STT_IFLYTEK_APP_ID" \
            "$STT_IFLYTEK_API_KEY" \
            "$STT_IFLYTEK_API_SECRET" \
            "$RESEND_API_KEY" \
            "$APP_VERSION" \
            "$APP_PUBLISHED_AT" \
            | ssh -i ~/.ssh/id_ed25519_primary "${SERVER_USER}@${SERVER_HOST}" '
                set -eu
                IFS= read -r stt_app_id
                IFS= read -r stt_api_key
                IFS= read -r stt_api_secret
                IFS= read -r resend_api_key
                IFS= read -r app_version
                IFS= read -r app_published_at
                set_env() {
                  name=$1
                  value=$2
                  escaped=$(printf "%s" "$value" | sed "s/[|&]/\\\\&/g")
                  if grep -q "^${name}=" /opt/kibotalk/.env; then
                    sed -i "s|^${name}=.*|${name}=${escaped}|" /opt/kibotalk/.env
                  else
                    printf "%s=%s\n" "$name" "$value" >> /opt/kibotalk/.env
                  fi
                }
                set_env RELAY_NODES_JSON "[]"
                set_env STT_ACTIVE "iflytek-realtime"
                set_env STT_IFLYTEK_APP_ID "$stt_app_id"
                set_env STT_IFLYTEK_API_KEY "$stt_api_key"
                set_env STT_IFLYTEK_API_SECRET "$stt_api_secret"
                set_env STT_IFLYTEK_WS_URL "wss://office-api-ast-dx.iflyaisol.com/ast/communicate/v1"
                set_env RELAY_PRIMARY_ORIGIN "https://kibotalk.superpowerlulu.win"
                set_env RESEND_API_KEY "$resend_api_key"
                set_env RESEND_FROM_EMAIL "noreply@mail.superpowerlulu.win"
                set_env RESEND_FROM_NAME "Superpower Lulu"
                set_env APP_VERSION "$app_version"
                set_env APP_DMG_URL "https://github.com/KiboAI/KiboTalk/releases/download/v${app_version}/KiboTalk-${app_version}-arm64.dmg"
                set_env APP_RELEASE_NOTES_URL "https://github.com/KiboAI/KiboTalk/releases/tag/v${app_version}"
                set_env APP_PUBLISHED_AT "$app_published_at"
                chmod 600 /opt/kibotalk/.env
              '
      - name: Validate server environments
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519_primary "${SERVER_USER}@${SERVER_HOST}" '
            set -eu
            test -s /opt/kibotalk/.env
            for name in \
              RELAY_PRIMARY_ORIGIN RELAY_NODES_JSON \
              RELAY_TOKEN_PRIVATE_KEY RELAY_TOKEN_PUBLIC_KEY RELAY_NODE_SECRET \
              STT_ACTIVE STT_IFLYTEK_APP_ID STT_IFLYTEK_API_KEY \
              STT_IFLYTEK_API_SECRET STT_IFLYTEK_WS_URL \
              LLM_ACTIVE RESEND_API_KEY RESEND_FROM_EMAIL RESEND_FROM_NAME \
              APP_VERSION APP_DMG_URL APP_RELEASE_NOTES_URL APP_PUBLISHED_AT; do
              grep -q "^${name}=." /opt/kibotalk/.env
            done
          '
      - name: Detect reusable server images
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          if ssh -i ~/.ssh/id_ed25519_primary "${SERVER_USER}@${SERVER_HOST}" \
            "docker image inspect kibotalk-postgres:17 >/dev/null 2>&1"; then
            echo "INCLUDE_POSTGRES_IMAGE=false" >> "$GITHUB_ENV"
          else
            echo "INCLUDE_POSTGRES_IMAGE=true" >> "$GITHUB_ENV"
          fi
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate release
        run: |
          pnpm typecheck
          pnpm test
      - name: Build API image
        run: |
          docker build --platform linux/amd64 --tag "kibotalk-api:${GITHUB_SHA}" .
          docker build --platform linux/amd64 --tag kibotalk-caddy:2.10 --file infra/production/Caddy.Dockerfile .
          if [ "$INCLUDE_POSTGRES_IMAGE" = "true" ]; then
            docker build --platform linux/amd64 --tag kibotalk-postgres:17 --file infra/production/Postgres.Dockerfile .
          fi
          touch infra/production/.env
          (
            cd infra/production
            POSTGRES_PASSWORD=validation docker compose -f compose.yaml \
              config --quiet --no-env-resolution --no-path-resolution
          )
          rm infra/production/.env
          docker run --rm \
            --volume "$PWD/infra/production/Caddyfile:/etc/caddy/Caddyfile:ro" \
            kibotalk-caddy:2.10 \
            caddy validate --config /etc/caddy/Caddyfile
          docker save \
            "kibotalk-api:${GITHUB_SHA}" \
            kibotalk-caddy:2.10 \
            | gzip -1 > /tmp/kibotalk-images.tar.gz
          if [ "$INCLUDE_POSTGRES_IMAGE" = "true" ]; then
            docker save kibotalk-postgres:17 | gzip -1 > /tmp/kibotalk-postgres-image.tar.gz
          fi
      - name: Stage on-device model mirror
        run: |
          pnpm --filter @kibotalk/desktop download-models
          tar -C apps/desktop/resources/bundle-models -czf /tmp/kibotalk-models.tar.gz .
      - name: Upload release payload
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519_primary "${SERVER_USER}@${SERVER_HOST}" \
            "mkdir -p /opt/kibotalk/incoming && rm -f /opt/kibotalk/incoming/kibotalk-postgres-image.tar.gz"
          scp -i ~/.ssh/id_ed25519_primary /tmp/kibotalk-images.tar.gz "${SERVER_USER}@${SERVER_HOST}:/opt/kibotalk/incoming/kibotalk-images.tar.gz"
          if [ -f /tmp/kibotalk-postgres-image.tar.gz ]; then
            scp -i ~/.ssh/id_ed25519_primary /tmp/kibotalk-postgres-image.tar.gz \
              "${SERVER_USER}@${SERVER_HOST}:/opt/kibotalk/incoming/kibotalk-postgres-image.tar.gz"
          fi
          scp -i ~/.ssh/id_ed25519_primary /tmp/kibotalk-models.tar.gz "${SERVER_USER}@${SERVER_HOST}:/opt/kibotalk/incoming/kibotalk-models.tar.gz"
          scp -i ~/.ssh/id_ed25519_primary infra/production/compose.yaml infra/production/Caddyfile "${SERVER_USER}@${SERVER_HOST}:/opt/kibotalk/"
      - name: Activate release
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          # GITHUB_SHA must expand on the runner before this script reaches the server.
          # shellcheck disable=SC2029
          ssh -i ~/.ssh/id_ed25519_primary "${SERVER_USER}@${SERVER_HOST}" "
            set -eu
            gzip -dc /opt/kibotalk/incoming/kibotalk-images.tar.gz | docker load
            if [ -f /opt/kibotalk/incoming/kibotalk-postgres-image.tar.gz ]; then
              gzip -dc /opt/kibotalk/incoming/kibotalk-postgres-image.tar.gz | docker load
              rm -f /opt/kibotalk/incoming/kibotalk-postgres-image.tar.gz
            fi
            rm -rf /opt/kibotalk/models.next
            mkdir -p /opt/kibotalk/models.next
            tar -xzf /opt/kibotalk/incoming/kibotalk-models.tar.gz -C /opt/kibotalk/models.next
            rm -rf /opt/kibotalk/models.previous
            if [ -d /opt/kibotalk/models ]; then
              mv /opt/kibotalk/models /opt/kibotalk/models.previous
            fi
            mv /opt/kibotalk/models.next /opt/kibotalk/models
            rm -rf /opt/kibotalk/models.previous
            cd /opt/kibotalk
            if grep -q '^KIBOTALK_API_IMAGE=' .env; then
              sed -i 's|^KIBOTALK_API_IMAGE=.*|KIBOTALK_API_IMAGE=kibotalk-api:${GITHUB_SHA}|' .env
            else
              printf '\nKIBOTALK_API_IMAGE=kibotalk-api:${GITHUB_SHA}\n' >> .env
            fi
            docker compose --env-file .env -f compose.yaml up -d --pull never
            # Models are swapped as a whole directory (mv), so the Caddy bind
            # mount must be re-established or it keeps serving the deleted
            # inode and returns 404 for /models/*.
            docker compose --env-file .env -f compose.yaml up -d --force-recreate --no-deps caddy
          "
      - name: Verify deployment
        run: |
          for _attempt in $(seq 1 24); do
            if curl --fail --silent --show-error https://kibotalk.superpowerlulu.win/health \
              && curl --fail --silent --show-error \
                https://kibotalk.superpowerlulu.win/models/onnx-community/wespeaker-voxceleb-resnet34-LM/config.json \
                >/dev/null \
              && curl --fail --silent --show-error --range 0-0 \
                https://kibotalk.superpowerlulu.win/models/onnx-community/wespeaker-voxceleb-resnet34-LM/onnx/model_quantized.onnx \
                >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          exit 1
