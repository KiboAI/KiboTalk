name: kibotalk-relay

services:
  api:
    image: ${KIBOTALK_RELAY_IMAGE:-kibotalk-relay-api:latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 8787
      APP_ENV: production
      SERVER_ROLE: relay
      RELAY_NODE_ID: cn-relay
      RELAY_OUTBOX_PATH: /app/data/usage-outbox.json
    ports:
      - "${RELAY_HTTP_PORT:-8443}:8787"
    volumes:
      - relay_data:/app/data

volumes:
  relay_data:
